# kimi 平台接口/策略覆盖。Kimi Code CLI 作宿主时以 skill 承载 dev-run（kimi 自动发现 user/project skill 目录、或 --skills-dir 加载），自然语言触发。
# 注意：本文件是「kimi 作宿主」的 skill 接口（agents/<platform>.yaml），与 scope 生成的运行时套餐表 .dev-run.yaml（单文件双层，见 references/scoping.md，不同物）无关。
# 装机：skills 工具的 --agent id 是 `kimi-cli`（本文件刻意用友好名 kimi.yaml 与后端名 kimi 对齐，故文件名 ≠ agent id）——
#   但其注册表把 kimi-cli 全局落点写死为 ~/.config/agents/skills（Kimi 不扫），项目级落 .agents/skills（共享目录）；
#   要落 Kimi 专属目录请走 scripts/skills.mjs（见 skills-def/INSTALL.md 的 Kimi 小节）。
#   Kimi 技能目录：项目级 .kimi-code/skills/ 或 .agents/skills/，用户级 ~/.kimi-code/skills/ 或 ~/.agents/skills/。
interface:
  display_name: "Dev Run"
  short_description: "统一非交互 AI CLI 执行（自动选后端）"
  default_prompt: "Use $dev-run to select the right backend, construct the command, and execute it directly."

policy:
  allow_implicit_invocation: false
