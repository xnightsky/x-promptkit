# pi 平台接口/策略覆盖。pi 作宿主时以 skill 承载 dev-run，自然语言触发。
# 注意：本文件是「pi 作宿主」的 skill 接口（agents/<platform>.yaml），与 scope 生成的运行时套餐表 .dev-run.yaml（单文件双层，见 references/scoping.md，不同物）无关。
interface:
  display_name: "Dev Run"
  short_description: "统一非交互 AI CLI 执行（自动选后端）"
  default_prompt: "Use $dev-run to select the right backend, construct the command, and execute it directly."

policy:
  allow_implicit_invocation: false
