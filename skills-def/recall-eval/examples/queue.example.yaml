# 召回队列最小样例（带队列的版本；非队列的 context 声明样例见
# skills-def/_shared/examples/context-layers.example.yaml）。
# 结构权威：../schemas/recall-queue.schema.yaml；本文件由单元测试保证持续合法。
version: 1
source_ref: ../SKILL.md
fallback_answer: 未明确
# context 块（可选）：显式声明是否加载项目提示词(repo)/全局提示词(global)。
# 缺省等价于两层都不加载；结构权威见 skills-def/_shared/schemas/prompt-context-layers.schema.yaml。
context:
  repo:
    enabled: false
  global:
    enabled: false
scoring:
  "2": 回答正确且关键边界完整
  "1": 方向正确但缺关键限制或表述偏弱
  "0": 回答错误、臆答、遗漏关键限制或答非所问
cases:
  - id: recall_eval.reject_missing_medium
    question: recall queue 缺少 medium 时，能否继续执行？
    medium: skill-mechanism
    expected:
      must_include:
        - 拒绝执行
        - medium
      should_include:
        - 需要先完善 queue
      must_not_include:
        - 继续执行
        - 自行猜测 medium
    score_rule:
      full: 明确答出缺 medium 时必须拒绝执行，并要求先完善 queue
      partial: 只答字段不完整或需要补充，但未明确拒绝执行
      fail: 回答可以继续评测，或允许执行器自行补 medium
    tags: [selftest, redline]
    source_scope: SKILL.md#medium-rule

  # ── skill-trigger 模式（模型自主执行命令） ──
  - id: recall_eval.trigger_validate_example
    question: 验证 skills-def/recall-eval/examples/queue.example.yaml 是否合法。请使用 recall-eval skill 来完成。
    medium: skill-trigger
    trigger:
      must_run:
        - "queue.example.yaml"
      must_not_run:
        - "rm"
        - "curl"
    available_skills:
      - path: ../SKILL.md
    expected:
      must_include:
        - "recall_eval"
    score_rule:
      full: 读取了队列文件并完成校验，报告通过验证
      partial: 读取了队列但验证不完整
      fail: 未触发或输出含 FAIL
    tags: [example, trigger]
    source_scope: SKILL.md#validation-strategy

  # ── decision 块（具名字段裁决：双极累加 weight + knockout 否决） ──
  - id: recall_eval.decision_routing_example
    question: 用户说『帮我写一个新的召回队列』，逐行输出 chosen_skill / answer_mode / answer_depth。
    medium: skill-mechanism
    expected:
      must_include:
        - recall-author
      decision:
        chosen_skill: { eq: recall-author, knockout: true }   # 选错 skill 直接失格
        answer_mode: { eq: author }                           # weight 缺省 2
        answer_depth: { eq: L2, weight: 1 }                   # 次要维度，值 1 分
    score_rule:
      full: 三维全命中，decision 累加 +5
      partial: answer_mode/answer_depth 偏差导致扣分
      fail: chosen_skill 选错 → knockout 失格
    tags: [example, decision]
    source_scope: SKILL.md#decision-rule
