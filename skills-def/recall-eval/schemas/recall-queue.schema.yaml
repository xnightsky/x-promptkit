# 召回队列契约的结构权威（类 JSON Schema 子集，由 _shared/schema-validator.mjs 解释执行）。
#
# SKILL.md 的 Case Contract 是本文件的 prose 镜像；两者不一致时，
# 以本文件 + 单元测试为准并同步修文档。
#
# schema 表达不了的跨字段语义留在 scripts/lib.mjs：
#   - 每用例必须能解析出生效 source_ref（队列级继承 + 用例级覆盖）
#   - context 块的 global.enabled 为 true 时必须给 path
# `context` 块的结构权威在 _shared（外部 $ref，文件名经 registry 解析）。
$schema: "https://json-schema.org/draft/2020-12/schema"
title: recall queue
type: object
required: [version, fallback_answer, scoring, cases]
properties:
  version:
    type: integer
    minimum: 1
  source_ref:
    $ref: "#/$defs/non_empty_string"
  fallback_answer:
    $ref: "#/$defs/non_empty_string"
  context:
    $ref: "prompt-context-layers.schema.yaml"
  scoring:
    type: object
    required: ["0", "1", "2"]
    properties:
      "0": { $ref: "#/$defs/non_empty_string" }
      "1": { $ref: "#/$defs/non_empty_string" }
      "2": { $ref: "#/$defs/non_empty_string" }
  # judge 的队列级执行配置（可选，对称 skill_trigger 先例）。
  # grader：裁判 provider id，缺省同被测 provider（一个 case 一次调用一个裁判）；
  # timeout_ms：judge 调用超时，覆盖 provider 缺省。
  judge:
    type: object
    additionalProperties: false
    properties:
      grader: { $ref: "#/$defs/non_empty_string" }
      timeout_ms:
        type: integer
        minimum: 1000
  # skill-trigger 模式的队列级配置（可选，缺省使用内置默认值）
  skill_trigger:
    type: object
    additionalProperties: false
    properties:
      permissions:
        $ref: "#/$defs/permissions"
      max_steps:
        type: integer
        minimum: 1
      timeout_ms:
        type: integer
        minimum: 1000
  cases:
    type: array
    minItems: 1
    items:
      $ref: "#/$defs/case"
$defs:
  non_empty_string:
    type: string
    pattern: "\\S"
  string_list:
    type: array
    items:
      $ref: "#/$defs/non_empty_string"
  # 命令权限配置（glob pattern 匹配，类 Claude Code 风格）。
  # 当前仅用于 skill_trigger；未来可复用于其他需要命令沙箱的场景。
  permissions:
    type: object
    additionalProperties: false
    properties:
      mode:
        type: string
        enum: [merge, override]
        # merge（默认）：用户 patterns 追加到内置默认；override：完全替换
      allow:
        type: array
        items: { $ref: "#/$defs/non_empty_string" }
      deny:
        type: array
        items: { $ref: "#/$defs/non_empty_string" }
  case:
    type: object
    required: [id, question, medium, expected, score_rule, tags, source_scope]
    properties:
      id: { $ref: "#/$defs/non_empty_string" }
      question: { $ref: "#/$defs/non_empty_string" }
      medium: { $ref: "#/$defs/non_empty_string" }
      carrier: { $ref: "#/$defs/non_empty_string" }
      source_scope: { $ref: "#/$defs/non_empty_string" }
      # skill-trigger 模式：必须触发的命令（子串匹配）
      trigger:
        type: object
        required: [must_run]
        properties:
          must_run:
            type: array
            minItems: 1
            items: { $ref: "#/$defs/non_empty_string" }
          must_not_run: { $ref: "#/$defs/string_list" }
      # skill-trigger 候选技能目录（缺省从 source_ref 构造）
      available_skills:
        type: array
        minItems: 1
        items:
          type: object
          required: [path]
          properties:
            path: { $ref: "#/$defs/non_empty_string" }
            name: { $ref: "#/$defs/non_empty_string" }
            desc: { $ref: "#/$defs/non_empty_string" }
      # 用例级覆盖（缺省继承队列级）
      source_ref: { $ref: "#/$defs/non_empty_string" }
      fallback_answer: { $ref: "#/$defs/non_empty_string" }
      variants:
        type: array
      # 用例级整块覆盖队列级 context（不做深合并）
      context:
        $ref: "prompt-context-layers.schema.yaml"
      expected:
        type: object
        required: [must_include]
        properties:
          must_include:
            type: array
            minItems: 1
            items: { $ref: "#/$defs/non_empty_string" }
          any_must_include: { $ref: "#/$defs/string_list" }
          should_include: { $ref: "#/$defs/string_list" }
          must_not_include: { $ref: "#/$defs/string_list" }
          # 具名裁定池（AI judge）：一条判断依据一项，声明即参与打分
          # （未被 decision 引用的项 = 缺省隐式维 weight 2 / 无否决；被引用则按精调维计分）。
          # AI 只产出布尔裁定（pass/fail），打分恒由 decision 静态机出口。
          # 设计权威：docs/specs/2026-06-11-decision-judge-verdict-design.md。
          judge:
            type: object
            minProperties: 1
            additionalProperties:        # key = 裁定名（开放，由 verdict: judge.<键> 引用）
              type: object
              required: [rubric]
              additionalProperties: false
              properties:
                rubric: { $ref: "#/$defs/non_empty_string" }  # 这条依据验什么（judge 的提问）
          # 具名字段裁决（精调链路；双极累加 + knockout 否决）。维度名由作者自定义；
          # 每维 eq / one_of / verdict 三种命中器恰一（恰一约束与 verdict 引用解析等
          # 跨字段语义在 lib.mjs；schema 子集表达不了 oneOf）。
          decision:
            type: object
            minProperties: 1
            additionalProperties:        # key = 自定义维度名（开放）
              type: object
              additionalProperties: false  # 维度内仅许声明键
              properties:
                eq: { $ref: "#/$defs/non_empty_string" }      # 字面等值期望
                one_of:                                        # 字面 OR：任一等值即命中
                  type: array
                  minItems: 1
                  items: { $ref: "#/$defs/non_empty_string" }
                verdict:                                       # 裁定引用：强制 judge.<池键> 前缀；
                  type: [string, array]                        # 数组 = 任一 pass 即命中
                  pattern: "\\S"
                  minItems: 1
                  items: { $ref: "#/$defs/non_empty_string" }
                from: { $ref: "#/$defs/non_empty_string" }    # 抽取正则（仅字面维）；缺省走行约定
                weight: { type: integer, minimum: 1 }         # 分值量级 ±weight；缺省 2
                knockout: { type: boolean }                    # 非命中即整题 FAIL；缺省 false
                absent: { $ref: "#/$defs/non_empty_string" }  # 缺席映射 zero|pass|fail（枚举在 lib 兜底）；缺省 zero
      score_rule:
        type: object
        required: [full, partial, fail]
        properties:
          full: { $ref: "#/$defs/non_empty_string" }
          partial: { $ref: "#/$defs/non_empty_string" }
          fail: { $ref: "#/$defs/non_empty_string" }
      tags:
        type: array
        minItems: 1
        items: { $ref: "#/$defs/non_empty_string" }
