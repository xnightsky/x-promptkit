# recall-eval provider 矩阵 v2 — 参考 pi models.json 结构。
#
# 用法:复制为 ".recall-replay.env.yaml" 填入真实值。
# 发现规则与环境变量 RECALL_REPLAY_MATRIX 同 v1。
#
# 字段约定（v2 采用 camelCase，对齐 pi 生态）：
#   apiKey  — 环境变量名或 inline key（优先查找同名环境变量）
#   baseUrl — 协议端点（如 https://api.deepseek.com/v1）
#   headers — 自定义请求头，位于 model 级别（伪装 UA、注入 beta flag）
#
# 支持的 api: anthropic-messages | openai-chat | echo

version: 2

defaults:
  api: openai-chat
  temperature: 0
  maxTokens: 512
  timeoutMs: 60000

# run.models（可选）：限定本轮跑的 provider。
# 语法："provider"（首个 model）或 "provider/model"（指定 model）。
# 省略或为空时，所有 enabled provider 的首个 model 均参与。
run:
  models: []
  # 示例：
  #   - deepseek-v4/deepseek-v4-pro  # 多 model provider 必须指定
  #   - deepseek-v4/deepseek-v4-flash # 否则歧义报错

providers:
  echo-selftest:
    enabled: true
    api: echo

  # ── openai-chat：DeepSeek v4 官方 ──
  deepseek-v4:
    enabled: false
    api: openai-chat
    baseUrl: https://api.deepseek.com/v1
    model: deepseek-v4-flash
    apiKey: DEEPSEEK_API_KEY
    models:
      - id: deepseek-v4-flash
      - id: deepseek-v4-pro

  # ── openai-chat 兼容（第三方 gateway / proxy） ──
  my-openai-proxy:
    enabled: false
    api: openai-chat
    baseUrl: https://your-proxy.example.com/v1
    apiKey: YOUR_API_KEY_ENV_OR_VALUE
    models:
      - id: your-model-name

  # ── anthropic-messages 兼容（第三方 gateway，支持伪装客户端头） ──
  # headers 小小巧思：model 级别的 headers 可绕过中转平台 UA 校验，
  # 让通用 runner 伪装成特定 CLI/SDK，避免 403 / unknown client。
  my-anthropic-proxy:
    enabled: false
    api: anthropic-messages
    baseUrl: https://your-proxy.example.com/anthropic
    apiKey: YOUR_API_KEY_ENV_OR_VALUE
    models:
      - id: your-model-name
        headers:
          user-agent: "claude-cli/2.1.150 (external, cli)"
          anthropic-beta: "claude-code-20250219,interleaved-thinking-2025-05-14"

  # # 将来按需支持：
