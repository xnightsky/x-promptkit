# recall-eval 的 provider 矩阵示例。
#
# 用法:把本文件复制为 ".recall-replay.env.yaml" 并填入真实值。两种安装位:
#   - 项目级:使用方仓库根目录(该文件已被 .gitignore 忽略)，矩阵跟项目走;
#   - 用户级:家目录，跨项目共享一份凭据——
#       Windows:   %USERPROFILE%\.recall-replay.env.yaml
#       Linux/macOS: ~/.recall-replay.env.yaml
#     同时存在时项目级优先(发现顺序见下)。
#
# 发现规则:依次在 cwd → 仓库根(从 cwd 向上找含 .git 的目录) → skill 目录 →
# 用户 home 目录中，读取 .recall-replay.env.yaml / .recall-replay.env.yml /
# .recall-replay.env 里第一个存在的文件;也可用 RECALL_REPLAY_MATRIX 环境变量
# 直接指定路径覆盖。home 目录跨平台可用:Windows 上即
# %USERPROFILE%\.recall-replay.env.yaml，Linux/macOS 上即 ~/.recall-replay.env.yaml。
# RECALL_REPLAY_MATRIX 的值支持 `~/` 前缀(由运行时显式展开为 home 目录，
# Windows 同样生效，无需依赖 shell 展开)。
#
# apikey 字段：既可以是环境变量名（如 DEEPSEEK_API_KEY），也可以直接写 key 值。
# 优先查找同名环境变量，找不到则把 apikey 值本身作为 key 使用。
#
# 支持的 api: anthropic-messages | openai-chat | echo

version: 1

defaults:
  api: echo
  temperature: 0
  max_tokens: 512
  timeout_ms: 60000

# run.matrix 可选:限定本轮使用哪些 provider（按 id）。
# 省略时默认使用所有 enabled 的 provider。
run:
  matrix: []

providers:
  - id: echo-selftest
    enabled: true
    api: echo

  - id: openai
    enabled: false
    api: openai-chat
    base_url: https://api.openai.com/v1
    model: gpt-4o-mini
    apikey: OPENAI_API_KEY

  - id: anthropic
    enabled: false
    api: anthropic-messages
    base_url: https://api.anthropic.com/v1
    model: claude-3-5-sonnet-latest
    apikey: ANTHROPIC_API_KEY

  # DeepSeek:走 OpenAI 兼容的 chat/completions 协议。
  - id: deepseek
    enabled: false
    api: openai-chat
    base_url: https://api.deepseek.com/v1
    model: deepseek-chat
    apikey: DEEPSEEK_API_KEY
