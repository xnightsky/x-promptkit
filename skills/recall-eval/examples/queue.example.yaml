# 召回队列最小样例（带队列的版本；非队列的 context 声明样例见
# skills/_shared/examples/context-layers.example.yaml）。
# 结构权威：../schemas/recall-queue.schema.yaml；本文件由单元测试保证持续合法。
version: 1
source_ref: skills/recall-eval/SKILL.md
fallback_answer: 未明确
# context 块（可选）：显式声明是否加载项目提示词(repo)/全局提示词(global)。
# 缺省等价于两层都不加载；结构权威见 skills/_shared/schemas/prompt-context-layers.schema.yaml。
context:
  repo:
    enabled: false
  global:
    enabled: false
scoring:
  "2": 回答正确且关键边界完整
  "1": 方向正确但缺关键限制或表述偏弱
  "0": 回答错误、臆答、遗漏关键限制或答非所问
cases:
  - id: recall_eval.reject_missing_medium
    question: recall queue 缺少 medium 时，能否继续执行？
    medium: skill-mechanism
    carrier: isolated-context-run:subagent
    expected:
      must_include:
        - 拒绝执行
        - medium
      should_include:
        - 需要先完善 queue
      must_not_include:
        - 继续执行
        - 自行猜测 medium
    score_rule:
      full: 明确答出缺 medium 时必须拒绝执行，并要求先完善 queue
      partial: 只答字段不完整或需要补充，但未明确拒绝执行
      fail: 回答可以继续评测，或允许执行器自行补 medium
    tags: [selftest, redline]
    source_scope: SKILL.md#medium-rule
