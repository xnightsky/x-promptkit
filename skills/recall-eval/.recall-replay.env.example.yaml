# recall-eval 的 provider 矩阵示例。
#
# 用法:把本文件复制到「使用方仓库根目录」下的 ".recall-replay.env.yaml"
# (该文件已被 .gitignore 忽略)，再填入真实值。
#
# 发现规则:运行时从当前工作目录(cwd)逐级向上找到仓库根(含 .git 的目录)，
# 在仓库根读取 .recall-replay.env.yaml / .recall-replay.env.yml / .recall-replay.env
# 中的第一个存在文件;也可用 RECALL_REPLAY_MATRIX 环境变量直接指定路径覆盖。
#
# apikey 字段：既可以是环境变量名（如 DEEPSEEK_API_KEY），也可以直接写 key 值。
# 优先查找同名环境变量，找不到则把 apikey 值本身作为 key 使用。
#
# 支持的 api: anthropic-messages | openai-chat | echo

version: 1

defaults:
  api: echo
  temperature: 0
  max_tokens: 512
  timeout_ms: 60000

# run.matrix 可选:限定本轮使用哪些 provider（按 id）。
# 省略时默认使用所有 enabled 的 provider。
run:
  matrix: []

providers:
  - id: echo-selftest
    enabled: true
    api: echo

  - id: openai
    enabled: false
    api: openai-chat
    base_url: https://api.openai.com/v1
    model: gpt-4o-mini
    apikey: OPENAI_API_KEY

  - id: anthropic
    enabled: false
    api: anthropic-messages
    base_url: https://api.anthropic.com/v1
    model: claude-3-5-sonnet-latest
    apikey: ANTHROPIC_API_KEY

  # DeepSeek:走 OpenAI 兼容的 chat/completions 协议。
  - id: deepseek
    enabled: false
    api: openai-chat
    base_url: https://api.deepseek.com/v1
    model: deepseek-chat
    apikey: DEEPSEEK_API_KEY
