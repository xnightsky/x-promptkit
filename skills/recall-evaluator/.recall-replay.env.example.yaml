# recall-evaluator 回放(replay)的 provider 矩阵示例。
#
# 用法:把本文件复制到「使用方仓库根目录」下的 ".recall-replay.env.yaml"
# (该文件已被 .gitignore 忽略)，再填入真实值。
#
# 发现规则:运行时从当前工作目录(cwd)逐级向上找到仓库根(含 .git 的目录)，
# 在仓库根读取 .recall-replay.env.yaml / .recall-replay.env.yml / .recall-replay.env
# 中的第一个存在文件;也可用 RECALL_REPLAY_MATRIX 环境变量直接指定路径覆盖。
#
# 密钥绝不能写在这里:请用 "key_env" 引用环境变量。
# 内联 "key" 仅允许用于离线的 "echo" 后端。

version: 1

defaults:
  api: echo
  temperature: 0
  max_tokens: 512
  timeout_ms: 60000

memory:
  # "in-process" 把召回到的事实只保留在临时 agent 内。
  # "upstream" 把持久化交给上游共享 recall 存储。
  mode: in-process
  namespace: recall-replay
  ttl_seconds: 0

context_policy:
  # 必须与上游 clean-context 策略 id 一致(clean-context-v1)。
  id: clean-context-v1
  assert_echo: true

providers:
  - id: echo-selftest
    enabled: true
    api: echo

  - id: openai
    enabled: false
    api: openai-chat
    base_url: https://api.openai.com/v1
    model: gpt-4o-mini
    key_env: OPENAI_API_KEY

  - id: anthropic
    enabled: false
    api: anthropic-messages
    base_url: https://api.anthropic.com/v1
    model: claude-3-5-sonnet-latest
    anthropic_version: "2023-06-01"
    key_env: ANTHROPIC_API_KEY

  - id: gemini
    enabled: false
    api: gemini-generate
    base_url: https://generativelanguage.googleapis.com/v1beta
    model: gemini-1.5-pro
    key_env: GEMINI_API_KEY

  # DeepSeek v4 flash:走 OpenAI 兼容的 chat/completions 协议。
  - id: deepseek-v4-flash
    enabled: false
    api: openai-chat
    base_url: https://api.deepseek.com/v1
    model: deepseek-v4-flash
    key_env: DEEPSEEK_API_KEY
