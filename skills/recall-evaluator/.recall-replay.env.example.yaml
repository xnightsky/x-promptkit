# Provider matrix for the recall-evaluator replay harness.
#
# Copy this file to ".recall-replay.env.yaml" (which is git-ignored) and fill in
# real values. Secrets must NEVER be written here: reference an environment
# variable via "key_env" instead. Inline "key" values are only allowed for the
# offline "echo" backend.
#
# Override the matrix path with the RECALL_REPLAY_MATRIX environment variable.

version: 1

defaults:
  api: echo
  temperature: 0
  max_tokens: 512
  timeout_ms: 60000

memory:
  # "in-process" keeps recalled facts inside the ephemeral agent only.
  # "upstream" defers persistence to the shared recall store.
  mode: in-process
  namespace: recall-replay
  ttl_seconds: 0

context_policy:
  # Must match the upstream clean-context policy id (clean-context-v1).
  id: clean-context-v1
  assert_echo: true

providers:
  - id: echo-selftest
    enabled: true
    api: echo

  - id: openai
    enabled: false
    api: openai-chat
    base_url: https://api.openai.com/v1
    model: gpt-4o-mini
    key_env: OPENAI_API_KEY

  - id: anthropic
    enabled: false
    api: anthropic-messages
    base_url: https://api.anthropic.com/v1
    model: claude-3-5-sonnet-latest
    anthropic_version: "2023-06-01"
    key_env: ANTHROPIC_API_KEY

  - id: gemini
    enabled: false
    api: gemini-generate
    base_url: https://generativelanguage.googleapis.com/v1beta
    model: gemini-1.5-pro
    key_env: GEMINI_API_KEY
