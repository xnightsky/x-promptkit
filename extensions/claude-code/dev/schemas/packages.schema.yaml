# 本文件由 scripts/sync-handoff-core.mjs 从 skills-def/dev-run/references/ 镜像生成，请勿手改；改源后跑 `npm run sync:handoff-core`。

# dev-run scope 套餐表结构权威（.dev-run.yaml 整文件；类 JSON Schema 子集，无运行时校验器，作写读两方契约）。
#
# 写方：scope（references/scoping.md 引擎）据此写 .dev-run.yaml（单文件、双层存储，规则见 scoping.md「存储」）。
# 读方：各宿主的交接入口（命令/便捷壳/skill 侧读默认档）据此取 default 档。
#
# 单文件多后端：顶层 version + default_backend + backends map；backend key 用 scoping.md「每后端 scope 配置」的落盘 key（pi/cursor/kimi）。
# 后端专属旋钮（如 pi 的 thinking）存 knobs 对象；其合法 key/值由 scoping.md 的「每后端 scope 配置」+ 校验步兜。
# schema 表达不了的跨字段约束（同样由 scoping.md 的 prose + 校验步兜）：
#   - default_backend 必须在同一文件的 backends 中存在对应 section。
#   - 每个 backend section 的 packages 至少 1 条。
#   - 每个 backend section 内恰好 1 条 default:true（0 条或 ≥2 条都非法）。
#   - 每条 model 必须命中当次该后端 list-models 结果集。
$schema: "https://json-schema.org/draft/2020-12/schema"
title: dev-run backend packages cheatsheet (.dev-run.yaml)
type: object
additionalProperties: false
required: [version, default_backend, backends]
properties:
  version:
    type: integer
    minimum: 1
  default_backend:
    enum: [pi, cursor, kimi]                 # 无显式后端时的路由默认值；须命中同文件 backends key
  backends:
    type: object
    minProperties: 1
    additionalProperties:          # key = 后端落盘 key（pi/cursor/kimi，见 scoping.md）
      type: object
      additionalProperties: false
      required: [packages]
      properties:
        packages:
          type: array
          minItems: 1
          items:
            $ref: "#/$defs/package"
$defs:
  package:
    type: object
    additionalProperties: false
    required: [name, model, case, default]
    properties:
      name:
        $ref: "#/$defs/non_empty_string"     # 套餐名，用户自定（如「多模态」「省钱」）
      model:
        $ref: "#/$defs/non_empty_string"     # 后端的 model id，须来自该后端 list-models 实际结果
      case:
        $ref: "#/$defs/non_empty_string"     # 一句话速查：适用场景
      descr:
        type: string                         # 可选长描述/注意事项（多行），存跟 model 强相关的整段告警
      default:
        type: boolean                        # 每个 backend section 内恰好一条 true
      knobs:
        type: object                         # 后端专属旋钮，如 pi 的 {thinking: medium}；cursor 无则省略/空对象
  non_empty_string:
    type: string
    pattern: "\\S"      # 至少一个非空白字符（对齐 recall-queue.schema.yaml，拒纯空白串）
